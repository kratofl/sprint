# All three mutations alias their result to `session` so sign-in, register and
# the Discord ticket share one result shape.
mutation Login($input: AuthRequestInput!) {
  session: login(input: $input) {
    token
  }
}

mutation Register($input: AuthRequestInput!) {
  session: register(input: $input) {
    token
  }
}

# Trades the single-use ticket from the Discord callback for a session (anonymous).
mutation RedeemSignInTicket($ticket: String!) {
  session: redeemSignInTicket(ticket: $ticket) {
    token
  }
}
