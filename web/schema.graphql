schema {
  query: Query
  mutation: Mutation
}

type Query {
  health: HealthStatus!
  serverSettings: ServerSettingsDto! @cost(weight: "10")
  me: UserProfile @authorize @cost(weight: "10")
  sessions: [SessionSummary!]! @authorize @cost(weight: "10")
  session(id: String!): SessionSummary @authorize @cost(weight: "10")
  setups: [SetupSummary!]! @authorize @cost(weight: "10")
  setup(id: String!): SetupSummary @authorize @cost(weight: "10")
  layouts: [LayoutSummary!]! @authorize @cost(weight: "10")
  layout(id: String!): LayoutSummary @authorize @cost(weight: "10")
  sharedLap(code: String!): SharedLapDto! @authorize @cost(weight: "10")
  mySharedLaps: [SharedLapSummary!]! @authorize @cost(weight: "10")
  engineerInvite(token: String!): EngineerInvitePreview! @cost(weight: "10")
  myEngineerInvites: [EngineerInviteDto!]! @authorize @cost(weight: "10")
  myEngineers: [EngineerLinkDto!]! @authorize @cost(weight: "10")
  myDrivers: [EngineerLinkDto!]! @authorize @cost(weight: "10")
  visibleSessions: [VisibleSession!]! @authorize @cost(weight: "10")
  visibleSession(id: String!): VisibleSession @authorize @cost(weight: "10")
  liveSessions: [LiveSessionDto!]! @authorize @cost(weight: "10")
  sessionTelemetry(sessionId: String!, maxPoints: Int! = 600): SessionTelemetry!
    @authorize
    @cost(weight: "10")
}

type Mutation {
  register(input: AuthRequestInput!): AuthResponse! @cost(weight: "10")
  login(input: AuthRequestInput!): AuthResponse! @cost(weight: "10")
  redeemSignInTicket(ticket: String!): AuthResponse! @cost(weight: "10")
  shareLap(input: ShareLapInput!): SharedLapSummary!
    @authorize
    @cost(weight: "10")
  revokeSharedLap(code: String!): SharedLapSummary!
    @authorize
    @cost(weight: "10")
  setDisplayName(displayName: String!): UserProfile!
    @authorize
    @cost(weight: "10")
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
    @authorize
    @cost(weight: "10")
  updateServerSettings(input: UpdateServerSettingsInput!): ServerSettingsDto!
    @authorize
    @cost(weight: "10")
  createSession(input: CreateSessionInput!): SessionSummary!
    @authorize
    @cost(weight: "10")
  saveSession(input: SaveSessionInput!): SessionSummary!
    @authorize
    @cost(weight: "10")
  saveSetup(input: SaveSetupInput!): SetupSummary!
    @authorize
    @cost(weight: "10")
  saveLayout(input: SaveLayoutInput!): LayoutSummary!
    @authorize
    @cost(weight: "10")
  createEngineerInvite: EngineerInviteDto! @authorize @cost(weight: "10")
  revokeEngineerInvite(token: String!): Boolean! @authorize @cost(weight: "10")
  acceptEngineerInvite(token: String!): EngineerLinkDto!
    @authorize
    @cost(weight: "10")
  removeEngineer(engineerId: String!): Boolean! @authorize @cost(weight: "10")
  leaveDriver(driverId: String!): Boolean! @authorize @cost(weight: "10")
  excludeEngineerFromSession(sessionId: String!, engineerId: String!): Boolean!
    @authorize
    @cost(weight: "10")
  includeEngineerInSession(sessionId: String!, engineerId: String!): Boolean!
    @authorize
    @cost(weight: "10")
}

type AccountSummary {
  id: String!
  displayName: String!
  avatarUrl: String
}

type AuthResponse {
  token: String!
}

type EngineerInviteDto {
  token: String!
  url: String!
  status: EngineerInviteStatus!
  createdAt: DateTime!
  expiresAt: DateTime!
}

type EngineerInvitePreview {
  status: EngineerInviteStatus!
  driver: AccountSummary
  expiresAt: DateTime
}

type EngineerLinkDto {
  driver: AccountSummary!
  engineer: AccountSummary!
  createdAt: DateTime!
}

type HealthStatus {
  status: String!
  service: String!
  version: String!
}

type LayoutSummary {
  id: String!
  ownerId: String!
  name: String!
  data: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type LiveLap {
  lap: Int!
  lapTime: Float!
  valid: Boolean!
  completedAt: Long!
}

type LiveSample {
  timestamp: Long!
  lap: Int!
  sector: Int!
  currentLapTime: Float!
  lastLapTime: Float!
  bestLapTime: Float!
  delta: Float!
  lapValid: Boolean!
  position: Int!
  speedKph: Float!
  rpm: Float!
  maxRpm: Float!
  gear: Int!
  throttle: Float!
  brake: Float!
  steering: Float!
  fuel: Float!
  trackPosition: Float!
  tyreTempFl: Float!
  tyreTempFr: Float!
  tyreTempRl: Float!
  tyreTempRr: Float!
  tyreWearFl: Float!
  tyreWearFr: Float!
  tyreWearRl: Float!
  tyreWearRr: Float!
}

type LiveSessionDto {
  sessionId: String!
  sessionKey: String!
  driver: AccountSummary!
  game: String!
  track: String!
  car: String!
  sessionType: String!
  startedAt: DateTime!
  connected: Boolean!
}

type ServerSettingsDto {
  instanceName: String!
  allowRegistration: Boolean!
  discordSignIn: Boolean!
}

type SessionEngineerAccess {
  engineer: AccountSummary!
  hasAccess: Boolean!
}

type SessionSummary {
  id: String!
  ownerId: String!
  sessionKey: String!
  game: String!
  track: String!
  car: String!
  sessionType: String!
  startedAt: DateTime
  data: String!
  createdAt: DateTime!
}

type SessionTelemetry {
  sessionId: String!
  sessionKey: String!
  samples: [LiveSample!]!
  laps: [LiveLap!]!
}

type SetupSummary {
  id: String!
  ownerId: String!
  name: String!
  game: String!
  car: String!
  track: String!
  data: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SharedLapDto {
  shareCode: String!
  sharedBy: String!
  game: String!
  trackCourse: String!
  carModel: String!
  lapNumber: Int!
  lapTimeSeconds: Float!
  drivenAt: DateTime
  payloadBase64: String!
}

type SharedLapSummary {
  id: String!
  shareCode: String!
  game: String!
  trackCourse: String!
  carModel: String!
  lapNumber: Int!
  lapTimeSeconds: Float!
  revoked: Boolean!
  createdAt: DateTime!
}

type UserProfile {
  id: String!
  email: String!
  displayName: String!
  isAdmin: Boolean!
  avatarUrl: String
  hasPassword: Boolean!
  discordLinked: Boolean!
  createdAt: DateTime!
}

type VisibleSession {
  id: String!
  sessionKey: String!
  driver: AccountSummary!
  isMine: Boolean!
  isLive: Boolean!
  game: String!
  track: String!
  car: String!
  sessionType: String!
  startedAt: DateTime
  createdAt: DateTime!
  data: String!
  engineerAccess: [SessionEngineerAccess!]!
}

input AuthRequestInput {
  email: String!
  password: String!
}

input CreateSessionInput {
  game: String!
  track: String!
  car: String!
  sessionType: String!
}

input SaveLayoutInput {
  id: String
  name: String!
  data: String!
}

input SaveSessionInput {
  id: String
  sessionKey: String
  game: String!
  track: String!
  car: String!
  sessionType: String!
  startedAt: DateTime
  data: String!
}

input SaveSetupInput {
  id: String
  name: String!
  game: String!
  car: String!
  track: String!
  data: String!
}

input ShareLapInput {
  game: String!
  trackCourse: String!
  carModel: String!
  lapNumber: Int!
  lapTimeSeconds: Float!
  drivenAt: DateTime
  payloadBase64: String!
}

input UpdateServerSettingsInput {
  instanceName: String!
  allowRegistration: Boolean!
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum EngineerInviteStatus {
  VALID
  EXPIRED
  USED
  REVOKED
  NOT_FOUND
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The authorize directive."
directive @authorize(
  "The name of the authorization policy that determines access to the annotated resource."
  policy: String
  "Roles that are allowed to access the annotated resource."
  roles: [String!]
  "Defines when the authorize directive shall be applied. By default the authorize directive is applied before the resolver is executed."
  apply: ApplyPolicy! = BEFORE_RESOLVER
) repeatable on OBJECT | FIELD_DEFINITION

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION