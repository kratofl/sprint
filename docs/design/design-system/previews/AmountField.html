<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>AmountField</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--label)}
.wrap{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-3xl)}
.lbl{width:96px;text-align:right;font-size:14px;color:var(--label-secondary)}
.f{display:flex;align-items:center;width:184px;height:48px;box-sizing:border-box;padding:0 var(--space-lg);border-radius:var(--radius-md);border:1px solid var(--focus-ring);outline:2px solid var(--focus-ring);outline-offset:2px;background:var(--surface)}
.f input{border:0;outline:none;background:transparent;width:100%;text-align:right;font-family:inherit;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label)}
.f span{margin-left:6px;font-size:15px;font-weight:600;color:var(--label-secondary)}
.hint{font-size:13px;color:var(--label-secondary)}
</style></head>
<body>
<div class="wrap">
<label class="lbl" for="a">Betrag</label>
<div class="f"><input id="a" inputmode="decimal" value="54,90"><span>€</span></div>
<span class="hint">Pflichtfeld</span>
</div>
</body>
</html>
