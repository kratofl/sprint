<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>Sheet</title>
<style>
body{margin:0;font-family:var(--font-sans);color:var(--label);font-size:14px}
.stage{height:330px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue-300),var(--brand-300))}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,0.22)}
.sheet{position:relative;width:440px;box-sizing:border-box;border-radius:var(--radius-lg);background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--shadow-glass)}
.hd{padding:var(--space-3xl) var(--space-3xl) var(--space-lg)}
.hd h2{margin:0;font-size:17px;font-weight:600}
.hd p{margin:2px 0 0;font-size:13px;color:var(--label-secondary)}
.row{display:grid;grid-template-columns:96px 1fr;column-gap:var(--space-lg);align-items:center;padding:0 var(--space-3xl);margin-bottom:10px}
.row label{text-align:right;color:var(--label-secondary)}
.f{height:40px;box-sizing:border-box;padding:0 var(--space-lg);border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center}
.ft{display:flex;justify-content:flex-end;gap:var(--space-sm);padding:var(--space-2xl) var(--space-3xl) var(--space-3xl)}
button{height:40px;padding:0 18px;border:0;border-radius:var(--radius-md);font-family:inherit;font-size:14px;font-weight:600}
.sec{background:var(--fill);color:var(--label)}
.pri{background:var(--brand-500);color:var(--on-brand)}
</style></head>
<body>
<div class="stage" style="position:relative">
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
<div class="hd"><h2 id="t">Neue Ausgabe</h2><p>Wird vom Budget September 2026 abgezogen.</p></div>
<div class="row"><label>Betrag</label><div class="f" style="width:160px;justify-content:flex-end;font-weight:600;font-variant-numeric:tabular-nums">54,90 <span style="margin-left:6px;color:var(--label-secondary)">€</span></div></div>
<div class="row"><label>Beschreibung</label><div class="f">REWE Markt</div></div>
<div class="ft"><button class="sec">Abbrechen</button><button class="pri">Hinzufügen</button></div>
</div>
</div>
</body>
</html>
