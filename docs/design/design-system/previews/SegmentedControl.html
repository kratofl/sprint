<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>SegmentedControl</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--label)}
.wrap{padding:var(--space-4xl) var(--space-3xl)}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:var(--radius-pill);background:var(--fill-strong)}
.seg button{width:88px;height:32px;border:0;border-radius:var(--radius-pill);background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--label);box-shadow:none}
.seg button[aria-checked="true"]{background:var(--segment-selected);font-weight:600;box-shadow:var(--shadow-none)}
.seg button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
</style></head>
<body>
<div class="wrap">
<div class="seg" role="radiogroup" aria-label="Zeitraum">
<button role="radio" aria-checked="false">Monat</button>
<button role="radio" aria-checked="true">Quartal</button>
<button role="radio" aria-checked="false">Jahr</button>
</div>
</div>
</body>
</html>
