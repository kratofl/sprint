<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>SearchField</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--label)}
.wrap{padding:var(--space-4xl) var(--space-3xl);display:flex;gap:var(--space-2xl)}
label{display:flex;align-items:center;gap:8px;width:280px;height:40px;box-sizing:border-box;padding:0 var(--space-xl);border-radius:var(--radius-pill);background:var(--fill);color:var(--label-secondary)}
input{border:0;background:transparent;outline:none;font:inherit;font-size:14px;flex-grow:1;color:var(--label)}
label:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
</style></head>
<body>
<div class="wrap">
<label><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="Suchen" aria-label="Suche"></label>
</div>
</body>
</html>
