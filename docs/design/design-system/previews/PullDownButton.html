<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>PullDownButton</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--label)}
.wrap{padding:var(--space-4xl) var(--space-3xl);display:flex;gap:var(--space-sm)}
button{display:inline-flex;align-items:center;gap:var(--space-xs);height:40px;padding:0 16px;border:0;border-radius:var(--radius-md);background:var(--fill);color:var(--label);font-family:inherit;font-size:14px;font-weight:600}
button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
</style></head>
<body>
<div class="wrap">
<button aria-haspopup="menu" aria-expanded="false">Exportieren<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<button aria-haspopup="menu" aria-expanded="false">Neu<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</body>
</html>
