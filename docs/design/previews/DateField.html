<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>DateField</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--label)}
.wrap{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-3xl)}
.lbl{width:96px;text-align:right;font-size:14px;color:var(--label-secondary)}
.f{display:flex;align-items:center;justify-content:space-between;width:148px;height:40px;box-sizing:border-box;padding:0 5px 0 var(--space-lg);border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface)}
.f input{border:0;outline:none;background:transparent;width:90px;font-family:inherit;font-size:14px;font-variant-numeric:tabular-nums;color:var(--label)}
.f button{width:28px;height:28px;border:0;border-radius:var(--radius-sm);background:var(--fill);color:var(--label);display:flex;align-items:center;justify-content:center}
</style></head>
<body>
<div class="wrap">
<label class="lbl" for="d">Datum</label>
<div class="f"><input id="d" value="27.09.2026"><button aria-label="Kalender öffnen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button></div>
</div>
</body>
</html>
