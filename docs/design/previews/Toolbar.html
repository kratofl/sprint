<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><title>Toolbar</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--label)}
.stage{position:relative;height:120px;overflow:hidden}
.under{position:absolute;left:24px;right:24px;top:30px;display:flex;gap:12px}
.under div{flex:1;height:70px;border-radius:var(--radius-xl)}
.bar{position:absolute;left:0;right:0;top:0;height:64px;box-sizing:border-box;padding:0 var(--space-4xl);display:flex;align-items:center;gap:var(--space-lg);background:var(--toolbar-bg);backdrop-filter:blur(var(--toolbar-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--toolbar-blur)) saturate(180%);border-bottom:1px solid var(--separator)}
.lead{flex:1 1 0;font-size:22px;font-weight:700;letter-spacing:-0.02em;margin:0}
.grp{display:flex;gap:2px;padding:4px;border-radius:var(--radius-pill);background:rgba(0,0,0,0.05)}
.grp span{width:84px;height:30px;border-radius:var(--radius-pill);font-size:13px;display:flex;align-items:center;justify-content:center}
.grp .sel{background:var(--segment-selected);font-weight:600;box-shadow:none}
.trail{flex:1 1 0;display:flex;justify-content:flex-end;gap:10px}
.ib{width:36px;height:32px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--label);display:flex;align-items:center;justify-content:center}
.search{width:200px;height:40px;box-sizing:border-box;border-radius:var(--radius-pill);background:rgba(0,0,0,0.05);display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--label-secondary)}
</style></head>
<body>
<div class="stage">
<div class="under"><div style="background:var(--brand-500)"></div><div style="background:var(--blue-500)"></div><div style="background:var(--purple-500)"></div><div style="background:var(--green-500)"></div></div>
<div class="bar" role="toolbar" aria-label="Werkzeugleiste">
<h1 class="lead">Übersicht</h1>
<div class="grp"><span>Woche</span><span class="sel">Monat</span><span>Quartal</span></div>
<div class="trail">
<div class="grp"><button class="ib" aria-label="Neu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button><button class="ib" aria-label="Teilen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"></path></svg></button></div>
<span class="search">Suchen</span>
</div>
</div>
</div>
</body>
</html>
