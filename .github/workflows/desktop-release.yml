name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            label: windows-amd64
            ext: ".exe"
          - os: ubuntu-latest
            rid: linux-x64
            label: linux-amd64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Extract version and channel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          lower=$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')
          if [[ "$lower" == *alpha* || "$lower" == *beta* || "$lower" == *rc* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Publish self-contained single-file binary
        shell: bash
        run: >-
          dotnet publish app/Sprint.Desktop.Client/Sprint.Desktop.Client.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true
          -p:InformationalVersion="$VERSION" -o app/build/bin

      - name: Package artifact
        shell: bash
        run: |
          name="sprint-${GITHUB_REF_NAME}-${{ matrix.label }}"
          bin="app/build/bin/Sprint.Desktop.Client${{ matrix.ext }}"
          [ -f "$bin" ] && chmod +x "$bin" || true
          # Ship the self-contained binary + its presets/assets as one archive
          # (the binary needs no installed .NET runtime).
          cd app/build/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../../../${name}.zip" ./* >/dev/null
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "../../../${name}.tar.gz" ./*
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
