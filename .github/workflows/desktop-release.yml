name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            label: windows-amd64
            ext: ".exe"
          - os: ubuntu-latest
            rid: linux-x64
            label: linux-amd64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '10.32.1'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Extract version and channel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          lower=$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')
          if [[ "$lower" == *alpha* || "$lower" == *beta* || "$lower" == *rc* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @sprint/types build

      - name: Publish native host
        shell: bash
        run: >-
          dotnet publish app/Sprint.Desktop.Host/Sprint.Desktop.Host.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true
          -p:InformationalVersion="$VERSION" -o app/desktop/resources/host

      - name: Build desktop renderer
        run: pnpm --filter @sprint/desktop build

      - name: Package desktop app
        run: pnpm --filter @sprint/desktop package

      - name: Package artifact
        shell: bash
        run: |
          name="sprint-${GITHUB_REF_NAME}-${{ matrix.label }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            platform=win32
          else
            platform=linux
          fi
          # electron-packager writes the packaged app to app/build/bin/Sprint-<platform>-<arch>/.
          # The updater extracts a downloaded archive straight into a staging directory and
          # mirrors that directory over the install directory (see UpdateScript.BuildWindowsBatch),
          # so the archive must contain this directory's files at its root, not the directory
          # itself.
          pkgdir="app/build/bin/Sprint-${platform}-x64"
          [ -d "$pkgdir" ] || { echo "::error::packaged app not found at $pkgdir"; exit 1; }
          [ -f "$pkgdir/Sprint" ] && chmod +x "$pkgdir/Sprint" || true
          cd "$pkgdir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../../../../${name}.zip" ./* >/dev/null
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "../../../../${name}.tar.gz" ./*
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
