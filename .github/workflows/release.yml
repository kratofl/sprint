name: Release

# The release button and the only way to release: Actions -> Release -> Run workflow. Picks the
# next version from the existing tags and the labels on the PRs merged since the last stable
# release (scripts/next-version.mjs), tags main with it, builds the desktop app into a GitHub
# Release and publishes the server images (images.yml) under the same version.
run-name: Release ${{ inputs.channel }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [pre-release, stable]
        default: pre-release

permissions:
  contents: read

# Runs queue rather than race; a queued run on an already released commit stops (next-version.mjs).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main, not ${GITHUB_REF_NAME}."
          exit 1

      # Full history, so every existing tag is here to count from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the next version
        id: next
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node scripts/next-version.mjs "$CHANNEL")
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing **$tag** from \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: tag
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the installer, its blockmap and the channel file (latest.yml, written for
          # pre-release tags too) that installed apps read to update. Linux: a tar.gz.
          - os: windows-latest
            rid: win-x64
            label: windows-amd64
            assets: |
              app/build/bin/sprint-*-setup.exe
              app/build/bin/sprint-*-setup.exe.blockmap
              app/build/bin/latest.yml
          - os: ubuntu-latest
            rid: linux-x64
            label: linux-amd64
            assets: app/build/bin/sprint-*-linux-*.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '10.32.1'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The host publish compiles the dash renderer crate natively (the runner's own target, which
      # matches matrix.rid) and to WebAssembly; the desktop build needs the WebAssembly one too.
      # The runner image ships rustup.
      - name: Setup Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Extract version and channel
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          lower=$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')
          if [[ "$lower" == *alpha* || "$lower" == *beta* || "$lower" == *rc* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @sprint/types build

      - name: Publish native host
        shell: bash
        run: >-
          dotnet publish app/Sprint.Desktop.Host/Sprint.Desktop.Host.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true
          -p:InformationalVersion="$VERSION" -o app/desktop/resources/host

      - name: Build desktop renderer
        run: pnpm --filter @sprint/desktop build

      # The uploaded names must stay as built: the channel file points at the installer by name.
      - name: Package desktop app
        shell: bash
        run: pnpm --filter @sprint/desktop package "$VERSION"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: ${{ matrix.assets }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

  images:
    name: Images
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
