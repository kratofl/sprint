name: Cut release

# The release button: Actions -> Cut release -> Run workflow. Picks the next version from the
# existing tags and the labels on the PRs merged since the last stable release
# (scripts/next-version.mjs), tags main with it and builds that tag. A tag pushed with GITHUB_TOKEN
# starts no other workflow, so this calls the desktop and image builds itself.
run-name: Cut ${{ inputs.channel }} release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [pre-release, stable]
        default: pre-release

permissions:
  contents: read

# Runs queue rather than race; a queued run on an already released commit stops (next-version.mjs).
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main, not ${GITHUB_REF_NAME}."
          exit 1

      # Full history, so every existing tag is here to count from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the next version
        id: next
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node scripts/next-version.mjs "$CHANNEL")
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing **$tag** from \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  images:
    name: Images
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
