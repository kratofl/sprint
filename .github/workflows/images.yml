name: Images

# Publishes the server images ghcr.io/<owner>/sprint-api and sprint-web for
# linux/amd64 + linux/arm64.
#   v*.*.* tag        -> :<tag> and :stable (no suffix) or :unstable (pre-release suffix)
#   push to main      -> :edge
# deploy/komodo/compose.yaml pulls :${SPRINT_VERSION:-unstable}.
on:
  push:
    tags:
      - 'v*.*.*'
    branches: [main]
    # Applies to main only; GitHub does not evaluate path filters for tag pushes.
    paths:
      - 'api/**'
      - 'web/**'
      - 'packages/**'
      - 'app/Sprint.Contracts/**'
      - 'app/Sprint.Desktop.Api/**'
      - 'app/Directory.Build.props'
      - 'global.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/images.yml'

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  # A newer main push supersedes an edge build; release tags always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Each platform builds on a runner of its own architecture; emulating arm64 on
  # an x86 runner makes dotnet publish and next build many times slower. Builds
  # push by digest only; merge tags the multi-arch manifest.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Keep in step with PLATFORMS above.
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        image:
          - { name: api, file: api/Dockerfile }
          - { name: web, file: web/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lowercase; the owner may not be.
      - name: Resolve image name and version
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/sprint-${{ matrix.image.name }}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=edge-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          # Only api/Dockerfile reads VERSION (stamped as InformationalVersion).
          build-args: VERSION=${{ env.VERSION }}
          # The source label links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image.name }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/${NAME}"
          touch "${RUNNER_TEMP}/digests/${NAME}/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  # Joins the per-platform digests into one multi-arch image per service and tags it.
  merge:
    name: Publish multi-arch images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        run: |
          # Tags: a release gets its own tag plus its channel; main gets edge.
          # A semver pre-release suffix (v1.2.0-beta.1) means the unstable channel.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              *-*) tags=("$GITHUB_REF_NAME" unstable) ;;
              *)   tags=("$GITHUB_REF_NAME" stable) ;;
            esac
          else
            tags=(edge)
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          expected=$(tr ',' '\n' <<< "$PLATFORMS" | wc -l)
          for service in api web; do
            image="${REGISTRY}/${owner}/sprint-${service}"
            sources=()
            for file in "${RUNNER_TEMP}/digests/${service}"/*; do
              sources+=("${image}@sha256:$(basename "$file")")
            done
            if [ "${#sources[@]}" -ne "$expected" ]; then
              echo "::error::${service}: ${#sources[@]} platform builds, expected ${expected}"
              exit 1
            fi
            tag_args=()
            for tag in "${tags[@]}"; do tag_args+=(-t "${image}:${tag}"); done
            # GHCR reads the repository link of a multi-arch image from the index.
            docker buildx imagetools create "${tag_args[@]}" \
              --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "${sources[@]}"
            docker buildx imagetools inspect "${image}:${tags[0]}"
          done
