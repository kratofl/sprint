name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (test + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: api/go.mod

      - name: Vet API
        run: go vet ./api/... ./pkg/...

      - name: Vet desktop app
        run: |
          cd app/frontend && pnpm install --frozen-lockfile && pnpm run build
          cd ../.. && cd app && go vet ./...
        continue-on-error: true  # requires Wails + built frontend

      - name: Test API
        run: go test ./api/...

      - name: Test shared packages
        run: go test ./pkg/...

  typescript:
    name: TypeScript (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '10.32.1'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @sprint/types build
          pnpm --filter @sprint/ui build

      - name: Frontend quality gate
        run: pnpm check:frontend-quality

      - name: Type check web
        run: pnpm --filter @sprint/web type-check

      - name: Build web
        run: pnpm --filter @sprint/web build

      - name: Build desktop frontend
        run: pnpm --filter @sprint/desktop build
