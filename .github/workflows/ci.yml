name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore api/Sprint.Api.slnx

      - name: Build API (warnings as errors)
        run: dotnet build api/Sprint.Api.slnx --no-restore -warnaserror

      - name: Test API
        run: dotnet test api/Sprint.Api.slnx --no-build

  typescript:
    name: TypeScript (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '10.32.1'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @sprint/types build
          pnpm --filter @sprint/ui build

      - name: Check GraphQL codegen is up to date
        run: pnpm --filter @sprint/web codegen:check

      - name: Type check web
        run: pnpm --filter @sprint/web type-check

      - name: Build web
        run: pnpm --filter @sprint/web build

  desktop:
    name: Desktop (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore desktop app
        run: dotnet restore app/Sprint.Desktop.slnx

      - name: Build desktop app
        run: dotnet build app/Sprint.Desktop.slnx --no-restore

      - name: Test desktop app
        run: dotnet test app/Sprint.Desktop.slnx --no-build
