name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore api/Sprint.Api.slnx

      - name: Build API (warnings as errors)
        run: dotnet build api/Sprint.Api.slnx --no-restore -warnaserror

      - name: Test API
        run: dotnet test api/Sprint.Api.slnx --no-build

  typescript:
    name: TypeScript (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.32.1'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The dash renderer crate (packages/dashboard/renderer); its WebAssembly build is what the
      # dashboard tests draw with. The runner image ships rustup.
      - name: Set up Rust
        run: |
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Build shared packages
        run: pnpm --filter @sprint/types build

      - name: Check GraphQL codegen is up to date
        run: pnpm --filter @sprint/web codegen:check

      - name: Type check web
        run: pnpm --filter @sprint/web type-check

      - name: Build web
        run: pnpm --filter @sprint/web build

      - name: Test and lint the dash renderer crate
        working-directory: packages/dashboard/renderer
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

      - name: Type check and test the dash renderer
        run: |
          pnpm --filter @sprint/dashboard type-check
          pnpm --filter @sprint/dashboard test

      - name: Type check and test the desktop app
        run: |
          pnpm --filter @sprint/desktop type-check
          pnpm --filter @sprint/desktop test

  desktop:
    name: Desktop (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The host build compiles the dash renderer crate natively (the runner's own target) and to
      # WebAssembly. The runner image ships rustup.
      - name: Set up Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Restore desktop app
        run: dotnet restore app/Sprint.Desktop.slnx

      # Warnings as errors, as `make lint-app` builds it locally.
      - name: Build desktop app (warnings as errors)
        run: dotnet build app/Sprint.Desktop.slnx --no-restore -warnaserror

      - name: Test desktop app
        run: dotnet test app/Sprint.Desktop.slnx --no-build

      # The host's command-surface tests are not in the solution.
      - name: Test native host
        run: dotnet test app/Sprint.Desktop.Host/Tests/Sprint.Desktop.Host.Tests.csproj -warnaserror

      # The real app end to end (app/desktop/scripts/smoke.mjs): Electron, preload, bridge and the
      # host together, hidden, replaying a short race. Uses the Debug host built above.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.32.1'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @sprint/types build

      - name: Smoke test the desktop app
        run: node app/desktop/scripts/smoke.mjs --shots smoke-shots

      - name: Keep the smoke test's screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots
          path: smoke-shots
          if-no-files-found: ignore
