version: 2
updates:
  # NuGet packages — .NET / Avalonia desktop app
  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: monthly

  # NuGet packages — .NET GraphQL API server (migrated from Go)
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: monthly

  # npm (pnpm workspace at repo root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
