[package]
name = "sprint-dash"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Sprint wheel-dash renderer: dash layout + telemetry frame -> pixels."

[lib]
name = "sprint_dash"
crate-type = ["rlib", "cdylib"]

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
